[flake8]
max-line-length = 100
extend-ignore =
    # E203/W503: whitespace-before-punctuation and line-break-before-binary-operator —
    # both conflict with how black formats code, so we defer to black instead.
    E203,
    W503
exclude =
    .venv,
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    notebooks
