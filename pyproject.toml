[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-origin"
version = "0.1.0"
description = "Wine cultivar classification example project (course template)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "black==26.5.1",
    "flake8==7.3.0",
    "ipykernel==7.3.0",
    "isort==8.0.1",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "nbstripout==0.9.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
