# Branch names on every pull request. The job name is the check name required
# by .github/rulesets/main.json.
name: conventions

on:
  pull_request:

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check branch name
        run: python3 scripts/git_conventions.py
